name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
          python3 -m pip install --break-system-packages 'meshtastic>=2.6' 'pytest>=8'
      - name: Run pytest
        run: xvfb-run -a python3 -m pytest
